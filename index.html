<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Александр Щербаков - сайт обновляется</title>
<meta name="description" content="Сайт Александра Щербакова обновляется. Скоро вернёмся.">
<style>
:root{--bg:#f6f4ef;--ink:#16181b;--soft:#6b6f76;--acc:#ff4a1c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
main{max-width:560px;text-align:center}
.dot{width:14px;height:14px;border-radius:50%;background:var(--acc);margin:0 auto 28px;animation:p 1.8s ease-in-out infinite}
@keyframes p{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.4}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
h1{font-weight:600;font-size:clamp(30px,6vw,46px);line-height:1.1;letter-spacing:-.02em;margin:0 0 14px}
p{margin:0 0 8px;color:var(--soft)}
.name{margin-top:32px;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="dot" aria-hidden="true"></div>
  <h1>Сайт обновляется.</h1>
  <p>Готовлю новую версию. Совсем скоро всё вернётся.</p>
  <p class="name">Александр Щербаков</p>
</main>
</body>
</html>
