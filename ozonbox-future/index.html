:root{
  --acid:#46e62e; --ink:#0e0f0d; --ink-2:#1b1d1a; --paper:#fff; --mist:#eceeec; --mist-2:#e3e6e3;
  --line:#dcdfdb; --mute:#6b6f6a; --r:26px; --r-s:16px; --ease:cubic-bezier(.2,.8,.2,1);
  --night:#0b0c0b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acid);outline-offset:3px;border-radius:8px}
.press{transition:transform .18s var(--ease),background .25s,color .25s}
.press:active{transform:scale(.96);transition-duration:.06s}
.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 24px;border-radius:99px;font-weight:700;font-size:15px;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn--acid{background:var(--acid);color:var(--ink)}
.btn--acid:hover{background:var(--ink);color:var(--acid)}
.btn--ink{background:var(--ink);color:var(--paper)}
.btn--ink:hover{background:var(--acid);color:var(--ink)}
.btn--white{background:var(--paper);color:var(--ink)}
.btn--sm{height:40px;padding:0 16px;font-size:14px}
.cnt{min-width:28px;height:28px;border-radius:99px;background:var(--acid);color:var(--ink);display:grid;place-items:center;font-size:13px;font-weight:800;padding:0 6px}
.cnt.bump{animation:bump .45s var(--ease)}
@keyframes bump{40%{transform:scale(1.35)}}
/* окна магазина светлые: текст в них тёмный, иначе наследуется белый с тёмной страницы */
.pd,.cd,.sr{color:var(--ink)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* верхняя строка поверх сцены */
.top{position:fixed;z-index:20;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;pointer-events:none}
.top>*{pointer-events:auto}
.back{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:14px;font-weight:700}
.back:hover{background:rgba(255,255,255,.16)}
.back svg{width:16px;height:16px}
.cart{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 6px 0 16px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:14px;font-weight:700}
.cart:hover{background:rgba(255,255,255,.16)}

/* сцена: картинка холодильника по размеру экрана без полос, как cover */
.stage{position:fixed;left:50%;top:50%;aspect-ratio:16/9;width:max(100vw,calc(100svh * 16 / 9));transform:translate(-50%,-50%)}
.stage>picture img{position:absolute;inset:0;width:100%;height:100%}
@media (orientation:portrait){.stage{aspect-ratio:9/16;width:max(100vw,calc(100svh * 9 / 16))}}

/* экран с логотипом */
.screen{position:absolute;left:var(--sx);top:var(--sy);width:var(--sw);transform:translate(-50%,-50%);opacity:0}
.screen svg{width:100%;height:auto;overflow:visible}
.screen .glow{position:absolute;inset:-40% -10%;background:radial-gradient(50% 50% at 50% 50%,rgba(70,230,46,.28),rgba(255,255,255,.08) 45%,transparent 70%);opacity:0;pointer-events:none}
.screen .logo{position:relative;filter:drop-shadow(0 0 6px rgba(255,255,255,.55)) drop-shadow(0 0 18px rgba(70,230,46,.35))}

/* мягкий свет сверху и блик по стеклу */
.light{position:absolute;left:var(--ix);top:var(--iy);width:var(--iw);height:var(--ih);background:radial-gradient(70% 45% at 50% 0%,rgba(255,255,255,.14),transparent 70%);pointer-events:none;opacity:.6}
.sheen{position:absolute;left:var(--ix);top:var(--iy);width:var(--iw);height:var(--ih);overflow:hidden;pointer-events:none;border-radius:2%}
.sheen::before{content:"";position:absolute;top:-10%;bottom:-10%;width:18%;left:-30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.09),transparent);transform:skewX(-12deg)}

/* товары на полках */
.pr{position:absolute;bottom:var(--b);left:var(--x);height:var(--h);transform:translateX(-50%);padding:0 3px;opacity:0;-webkit-tap-highlight-color:transparent}
.pr__in{position:relative;height:100%;display:block;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.pr img{height:100%;width:auto;max-width:none;position:relative;z-index:2;user-select:none;-webkit-user-drag:none}
.pr__in::after{content:"";position:absolute;z-index:1;left:-35%;right:-35%;bottom:-14%;height:42%;background:radial-gradient(closest-side,rgba(70,230,46,.38),rgba(255,255,255,.12) 55%,transparent);opacity:0;transition:opacity .26s ease}
.pr__in::before{content:"";position:absolute;z-index:1;left:8%;right:8%;bottom:-3%;height:7%;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(2px)}
.pr__tag{position:absolute;z-index:5;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,6px);white-space:nowrap;padding:7px 12px;border-radius:12px;background:rgba(14,15,13,.82);border:1px solid rgba(70,230,46,.45);font-size:13px;font-weight:700;line-height:1.2;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease)}
.pr--l .pr__tag{left:0;transform:translate(0,6px)}
.pr--r .pr__tag{left:auto;right:0;transform:translate(0,6px)}
/* табличка раздела на полке */
.tagx{position:absolute;left:var(--x);bottom:calc(var(--b) + .6%);padding:4px 9px;border-radius:7px;border:1px solid rgba(70,230,46,.55);background:rgba(10,12,10,.6);color:rgba(255,255,255,.88);font-size:clamp(9px,.75vw,12px);font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;pointer-events:none;opacity:0}
.pr__tag b{display:block;color:var(--acid);font-weight:800}
@media (hover:hover){
  .pr:hover .pr__in{transform:translateY(-6px) scale(1.04)}
  .pr:hover .pr__in::after,.pr:focus-visible .pr__in::after{opacity:.85}
  .pr:hover .pr__tag,.pr:focus-visible .pr__tag{opacity:1;transform:translate(-50%,0)}
  .pr--l:hover .pr__tag,.pr--r:hover .pr__tag,.pr--l:focus-visible .pr__tag,.pr--r:focus-visible .pr__tag{transform:translate(0,0)}
  .shelves:has(.pr:hover) .pr:not(:hover) .pr__in{opacity:.72}
}
.pr:focus-visible{outline:none}
.pr:focus-visible .pr__in{transform:translateY(-6px) scale(1.04);outline:2px solid var(--acid);outline-offset:4px;border-radius:10px}
.pr.wink .pr__in::after{animation:wink .9s ease}
@keyframes wink{30%,60%{opacity:.9}}

/* стеклянные двери, которые распахиваются при входе */
.doors{position:absolute;left:var(--dx);top:var(--dy);width:var(--dw);height:var(--dh);perspective:1400px;pointer-events:none}
.door{position:absolute;top:0;bottom:0;width:50%;backface-visibility:hidden;background:linear-gradient(160deg,rgba(40,43,40,.62),rgba(12,13,12,.7) 55%,rgba(26,28,26,.64));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.door::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.09) 42%,transparent 52%)}
.door--l{left:0;transform-origin:left center;border-radius:18px 4px 4px 18px}
.door--r{right:0;transform-origin:right center;border-radius:4px 18px 18px 4px}
.door i{position:absolute;top:38%;bottom:38%;width:3px;border-radius:3px;background:rgba(255,255,255,.35)}
.door--l i{right:8%}.door--r i{left:8%}
@media (orientation:portrait){.doors{perspective:900px}}

/* табличка «Наборы и боксы» на нижней панели холодильника */
.boxes{position:absolute;left:var(--bx);top:var(--by);transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:10px;padding:0 18px;height:clamp(36px,3.2vw,46px);border-radius:99px;border:1px solid rgba(70,230,46,.6);background:rgba(10,12,10,.55);color:var(--paper);font-family:Unbounded,Manrope,sans-serif;font-weight:500;font-size:clamp(12px,1vw,15px);letter-spacing:.02em;white-space:nowrap;box-shadow:0 0 18px rgba(70,230,46,.25),inset 0 0 12px rgba(70,230,46,.12);opacity:0;transition:background .25s,color .25s}
.boxes svg{width:16px;height:16px;color:var(--acid)}
.boxes:hover{background:var(--acid);color:var(--ink)}
.boxes:hover svg{color:var(--ink)}
.hint{position:fixed;z-index:15;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 16px;border-radius:99px;background:rgba(14,15,13,.7);border:1px solid rgba(255,255,255,.12);font-size:13px;font-weight:700;color:rgba(255,255,255,.85);white-space:nowrap;opacity:0}
.hint i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acid);margin-right:8px;vertical-align:1px}

@media (prefers-reduced-motion:reduce){.sheen::before{display:none}.pr__in{transition:none}}
</style>

ll="white"></path> <path d="M250.186 13.5619L248.384 9.86306L246.328 6.48706H241.219L247.708 16.1747L240.481 27.0368L245.54 27.0366L247.989 23.1909L250.158 19.2278H250.298L252.41 23.0735L254.973 27.0366L260 27.0368L252.777 16.1747L259.174 6.48706H254.156L252.213 9.68687L250.298 13.5619H250.186Z" fill="white"></path> </g> </svg></div>

<script src="shop.js?v=f3"></script>
<script>
// Витрина OzoneBox Future. Фон - картинка пустого холодильника (Higgsfield), товары - настоящие вырезки
// поверх неё: надписи на упаковке нейросеть не рисует. Координаты полок - доли картинки в процентах.
(() => {
  const { byId, rub, open } = OZB;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const port = matchMedia("(orientation: portrait)");
  const $ = (s) => document.querySelector(s);
  // относительная высота упаковки: флакон маски самый высокий, банка масла самая низкая
  const K = { "maska-volosy": .92, "shampun": .92, "maska-shampun": .92, "anticellulit": .9, "ochischenie": .86, "ozodermik-3": .8, "ozodermik-5": .76,
    "dnevnoy-krem": .72, "krem-pryschi": .72, "otri-6000": .64, "stop-akne": .6, "super-duet": .95, "super-trio": .9,
    "chistaya-kozha": .8, "idealnoe-telo": .8, "sos-boks": .8, "vosstanovlenie-volos": .8, "set-lico": .8, "super-kombo": .82 };
  // ширина/высота картинок img/shelf/ - чтобы расставить товары по ширине упаковки
  const RATIO = {"anticellulit": 0.291, "chistaya-kozha": 1.244, "dnevnoy-krem": 0.479, "idealnoe-telo": 1.244, "krem-pryschi": 0.406, "maska-shampun": 0.542, "maska-volosy": 0.29, "ochischenie": 0.326, "otri-6000": 0.646, "ozodermik-3": 0.67, "ozodermik-5": 0.411, "set-lico": 1.546, "shampun": 0.289, "sos-boks": 1.244, "stop-akne": 0.73, "super-duet": 0.658, "super-kombo": 1.51, "super-trio": 0.981, "vosstanovlenie-volos": 1.244};
  const L = {
    wide: { boxes: [50, 84.5], screen: [50, 13.2, 16], inner: [35.6, 20.5, 28.8, 59], doors: [35.4, 20, 29.2, 60.5], x: [37.4, 62.6], lab: 4.4, h: 11,
      shelves: [[34.1, ["maska-volosy", "shampun", "maska-shampun", "vosstanovlenie-volos", "sos-boks"], "Волосы"],
                [47.9, ["dnevnoy-krem", "ochischenie", "super-duet", "chistaya-kozha", "set-lico"], "Лицо"],
                [60.9, ["ozodermik-5", "krem-pryschi", "ozodermik-3", "stop-akne", "super-kombo"], "Точечно"],
                [74.8, ["otri-6000", "anticellulit", "super-trio", "idealnoe-telo"], "Тело"]] },
    tall: { boxes: [50, 78.6], screen: [50, 17.2, 40], inner: [21, 21.5, 58, 50.5], doors: [20.6, 21.2, 58.8, 51], x: [24, 75], lab: 0, h: 8.8,
      shelves: [[32.8, ["maska-volosy", "shampun", "maska-shampun", "vosstanovlenie-volos"]], [42.7, ["dnevnoy-krem", "ochischenie", "super-duet", "chistaya-kozha"]],
                [52.7, ["ozodermik-5", "krem-pryschi", "ozodermik-3", "stop-akne", "sos-boks"]], [61.8, ["otri-6000", "anticellulit", "super-trio", "idealnoe-telo"]],
                [71.5, ["set-lico", "super-kombo"]]] },
  };
  const stage = $("#stage"), shelves = $("#shelves");
  const setBox = (el, p, [x, y, w, h]) => { el.style.setProperty(p + "x", x + "%"); el.style.setProperty(p + "y", y + "%"); el.style.setProperty(p + "w", w + "%"); el.style.setProperty(p + "h", h + "%"); };
  let items = [];
  const render = () => {
    const c = port.matches ? L.tall : L.wide;
    const s = $("#screen"); s.style.setProperty("--sx", c.screen[0] + "%"); s.style.setProperty("--sy", c.screen[1] + "%"); s.style.setProperty("--sw", c.screen[2] + "%");
    const bx = $("#boxes"); bx.style.setProperty("--bx", c.boxes[0] + "%"); bx.style.setProperty("--by", c.boxes[1] + "%");
    setBox($("#light"), "--i", c.inner); setBox($("#sheen"), "--i", c.inner); setBox($("#doors"), "--d", c.doors);
    const [x0, x1] = c.x;
    const asp = port.matches ? 16 / 9 : 9 / 16; // высота сцены / ширина сцены
    shelves.innerHTML = c.shelves.map(([base, ids, tag]) => {
      const a0 = x0 + c.lab, room = x1 - a0;
      let hs = ids.map((id) => c.h * K[id]), ws = ids.map((id, i) => hs[i] * RATIO[id] * asp);
      const sum = ws.reduce((a, b) => a + b, 0), f = Math.min(1, room * .94 / sum);
      hs = hs.map((h) => h * f); ws = ws.map((w) => w * f);
      const gap = (room - sum * f) / (ids.length + 1);
      let at = a0 + gap;
      return (tag ? `<span class="tagx" style="--x:${x0}%;--b:${(100 - base).toFixed(2)}%">${tag}</span>` : "") + ids.map((id, i) => {
        const p = byId[id], x = at + ws[i] / 2; at += ws[i] + gap;
        return `<button class="pr${i === 0 ? " pr--l" : i === ids.length - 1 ? " pr--r" : ""}" type="button" data-id="${id}" style="--x:${x.toFixed(2)}%;--b:${(100 - base).toFixed(2)}%;--h:${hs[i].toFixed(2)}%" aria-label="${p[1]}, ${rub(p[2])}"><span class="pr__in"><img src="img/shelf/${id}.webp" alt="" draggable="false"><span class="pr__tag">${p[1]}<b>${rub(p[2])}</b></span></span></button>`;
      }).join("");
    }).join("");
    items = [...shelves.querySelectorAll(".pr")];
  };
  render();

  // открытие сцены: экран разгорается, двери распахиваются, товары встают по полкам сверху вниз
  const show = (el) => (el.style.opacity = 1);
  const finale = () => { show($("#boxes")); shelves.inert = false; items.forEach(show); shelves.querySelectorAll(".tagx").forEach(show); show($("#screen")); $("#glow").style.opacity = .7; $("#doors").style.display = "none"; show($("#hint")); };
  let run = [];
  const play = () => {
    if (reduce) { [...items, ...shelves.querySelectorAll(".tagx"), $("#screen"), $("#hint"), $("#boxes")].forEach((e) => e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250, fill: "forwards" })); $("#doors").style.display = "none"; $("#glow").style.opacity = .7; shelves.inert = false; return; }
    const A = (el, kf, o) => { const a = el.animate(kf, { fill: "both", ...o }); run.push(a); return a; };
    A($("#screen"), [{ opacity: 0, transform: "translate(-50%,-50%) scale(.985)" }, { opacity: .9, offset: .12 }, { opacity: .25, offset: .22 }, { opacity: 1, offset: .4 }, { opacity: .6, offset: .55 }, { opacity: 1, transform: "translate(-50%,-50%) scale(1)" }], { duration: 750, delay: 150 });
    A($("#glow"), [{ opacity: 0 }, { opacity: .7 }], { duration: 900, delay: 300, easing: "cubic-bezier(.3,0,.2,1)" });
    const dl = $("#doorL"), dr = $("#doorR"), ang = port.matches ? 95 : 105;
    A(dl, [{ transform: "rotateY(0)" }, { transform: "rotateY(-1.5deg)" }, { transform: "rotateY(0)" }], { duration: 120, delay: 700, easing: "cubic-bezier(.4,0,.6,1)", fill: "none" });
    A(dl, [{ transform: "rotateY(0)", opacity: 1 }, { opacity: 1, offset: .85 }, { transform: `rotateY(-${ang}deg)`, opacity: 0 }], { duration: 1080, delay: 820, easing: "cubic-bezier(.7,0,.2,1)" });
    A(dr, [{ transform: "rotateY(0)", opacity: 1 }, { opacity: 1, offset: .85 }, { transform: `rotateY(${ang}deg)`, opacity: 0 }], { duration: 1080, delay: 845, easing: "cubic-bezier(.7,0,.2,1)" }).finished.then(() => ($("#doors").style.display = "none")).catch(() => {});
    shelves.querySelectorAll(".tagx").forEach((el, i) => A(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: 1200 + i * 120 }));
    items.forEach((el, i) => A(el, [{ opacity: 0, transform: "translateX(-50%) translateY(14px) scale(.96)" }, { opacity: 1, offset: .6 }, { opacity: 1, transform: "translateX(-50%) translateY(0) scale(1)" }],
      { duration: 520, delay: 1250 + i * 70 + Math.round(Math.random() * 40 - 20), easing: "cubic-bezier(.22,1,.36,1)" }));
    setTimeout(() => (shelves.inert = false), 1300);
    A($("#boxes"), [{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: 2100 });
    A($("#hint"), [{ opacity: 0, transform: "translate(-50%,8px)" }, { opacity: 1, transform: "translate(-50%,0)" }], { duration: 400, delay: 2300, easing: "cubic-bezier(.2,.8,.2,1)" });
    // нажатие во время заставки - сразу к концу
    addEventListener("pointerdown", () => run.forEach((a) => { try { a.finish(); } catch (e) {} }), { once: true });
    setTimeout(breathe, 2400);
    setTimeout(() => { const w = items[Math.floor(Math.random() * items.length)]; if (w) w.classList.add("wink"); }, 6000);
  };
  const go = () => requestAnimationFrame(play);
  const bg = $("#bg");
  (bg.decode ? bg.decode() : Promise.resolve()).then(go, go);

  // едва заметное дыхание света - только opacity и одна полоса блика
  const breathe = () => {
    if (reduce) return;
    $("#light").animate([{ opacity: .55 }, { opacity: .8 }], { duration: 6000, iterations: Infinity, direction: "alternate", easing: "ease-in-out" });
    $("#glow").animate([{ opacity: .7 }, { opacity: .6 }, { opacity: .7 }, { opacity: .62, offset: .9 }, { opacity: .45, offset: .92 }, { opacity: .7 }], { duration: 10000, iterations: Infinity });
    $("#sheen").classList.add("go"); // полоса блика - CSS-анимация псевдоэлемента
  };

  // товар: на компьютере - подъём и подпись при наведении, на телефоне - вспышка и карточка
  const hideHint = () => { const h = $("#hint"); if (h.dataset.gone) return; h.dataset.gone = 1; h.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: "forwards" }); };
  setTimeout(hideHint, 9000);
  shelves.addEventListener("click", (e) => {
    const b = e.target.closest(".pr"); if (!b) return;
    hideHint();
    if (matchMedia("(hover: none)").matches && !reduce) { b.classList.remove("wink"); void b.offsetWidth; b.classList.add("wink"); setTimeout(() => open(b.dataset.id), 140); }
    else open(b.dataset.id);
  });
  port.addEventListener("change", () => { run.forEach((a) => { try { a.finish(); } catch (e) {} }); render(); finale(); });
  document.addEventListener("visibilitychange", () => document.getAnimations().filter((a) => a.effect && a.effect.getTiming().iterations === Infinity).forEach((a) => (document.hidden ? a.pause() : a.play())));
})();
</script>
<style>
.sheen.go::before{animation:sheen 15s 1s linear infinite}
@keyframes sheen{0%{left:-30%}47%{left:120%}100%{left:120%}}
</style>
